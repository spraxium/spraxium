name: Database templates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'packages/cli/**'
      - 'packages/common/**'
      - 'packages/core/**'
      - 'packages/env/**'
      - 'packages/logger/**'
      - 'tests/database-templates/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/database-templates.yml'
  pull_request:
    paths:
      - 'templates/**'
      - 'packages/cli/**'
      - 'packages/common/**'
      - 'packages/core/**'
      - 'packages/env/**'
      - 'packages/logger/**'
      - 'tests/database-templates/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/database-templates.yml'

concurrency:
  group: database-templates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Database templates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npm ci --prefix tests/database-templates --no-audit --no-fund
      - name: Start disposable databases
        working-directory: tests/database-templates
        run: docker compose -p spraxium-orm-validation up -d --wait --wait-timeout 180
      - name: Generate, migrate, build and execute every database template
        working-directory: tests/database-templates
        env:
          ORM_POSTGRES_URL: postgresql://spraxium:template-test@127.0.0.1:55437/spraxium
          ORM_MYSQL_URL: mysql://root:template-test@127.0.0.1:53317/spraxium
          ORM_MONGO_URL: mongodb://127.0.0.1:57027/spraxium
        run: npm test
      - name: Stop disposable databases
        if: always()
        working-directory: tests/database-templates
        run: docker compose -p spraxium-orm-validation down -v
