name: Release

on:
  push:
    branches:
      - main
    tags:
      - "preview-*-dev.*"

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/preview-') && 'release-next' || format('release-{0}', github.sha) }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or Publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Create Version PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          title: "🚀 release(repo): bump package versions"
          commit: "🚀 release(repo): bump package versions"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"

  preview:
    name: Publish preview to npm
    if: startsWith(github.ref, 'refs/tags/preview-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install and lint
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint

      - name: Set preview versions
        env:
          PREVIEW_TAG: ${{ github.ref_name }}
        run: |
          preview_version="${PREVIEW_TAG#preview-}"
          if ! [[ "$preview_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a tag like preview-1.0.0-dev.1."
            exit 1
          fi

          PREVIEW_VERSION="$preview_version" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const path = '.changeset/config.json';
          const config = JSON.parse(readFileSync(path, 'utf8'));
          const build = process.env.PREVIEW_VERSION.split('.').at(-1);
          config.snapshot = { useCalculatedVersion: true, prereleaseTemplate: '{tag}.' + build };
          writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

          pnpm exec changeset version --snapshot dev
          echo "PREVIEW_VERSION=$preview_version" >> "$GITHUB_ENV"

      - name: Build and test the preview
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build
          pnpm run typecheck
          pnpm run test

      - name: Pack and verify the preview
        run: |
          directory="$RUNNER_TEMP/spraxium-preview"
          mkdir -p "$directory"
          pnpm --filter './packages/*' -r pack --pack-destination "$directory"

          group="$(jq -c '.fixed[] | select(index("@spraxium/core"))' .changeset/config.json)"
          archives=("$directory"/*.tgz)
          test "${#archives[@]}" -eq "$(jq 'length' <<< "$group")"
          for archive in "${archives[@]}"; do
            tar -xOf "$archive" package/package.json | jq -e \
              --arg version "$PREVIEW_VERSION" --argjson group "$group" '
                .name as $name |
                .version == $version and ($group | index($name)) != null and
                all(((.dependencies // {}) + (.peerDependencies // {}) + (.optionalDependencies // {})) | to_entries[];
                  .key as $dependency | ($group | index($dependency)) == null or .value == $version)
              ' >/dev/null
          done

          consumer="$RUNNER_TEMP/spraxium-preview-consumer"
          mkdir -p "$consumer"
          printf '{"name":"spraxium-preview-consumer","version":"0.0.0","private":true}\n' > "$consumer/package.json"
          npm install --prefix "$consumer" --no-save --no-audit "${archives[@]}"
          cd "$consumer"
          test "$(node node_modules/@spraxium/cli/dist/index.js --version)" = "$PREVIEW_VERSION"
          node node_modules/@spraxium/cli/dist/index.js use --help
          node --input-type=module -e "await import('@spraxium/core'); await import('@spraxium/signal-client');"
          node -e "require('@spraxium/signal-client')"

      - name: Publish next
        run: |
          current="$(npm view @spraxium/core dist-tags.next --prefer-online)"
          if [[ -n "$current" ]]; then
            CURRENT_PREVIEW="$current" pnpm --filter @spraxium/cli exec node -e '
              const semver = require("semver");
              if (semver.gt(process.env.CURRENT_PREVIEW, process.env.PREVIEW_VERSION)) {
                throw new Error("The Core next tag already points to a newer preview.");
              }
            '
          fi

          publish_package() {
            local archive="$1" name="$2" current
            current="$(npm view "$name" dist-tags.next --prefer-online)"
            if [[ "$current" != "$PREVIEW_VERSION" ]]; then
              npm publish "$archive" --tag next --access public --provenance
            fi
          }

          core_archive=
          for archive in "$RUNNER_TEMP/spraxium-preview"/*.tgz; do
            name="$(tar -xOf "$archive" package/package.json | jq -er '.name')"
            if [[ "$name" == "@spraxium/core" ]]; then
              core_archive="$archive"
            else
              publish_package "$archive" "$name"
            fi
          done
          test -n "$core_archive"
          publish_package "$core_archive" @spraxium/core
